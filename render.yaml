# Render Blueprint for the API (ADR 0009). The frontend is on GitHub Pages (.github/workflows/pages.yml).
# The free plan sleeps after 15 minutes without traffic and has no persistent disk, so the
# SQLite cache in storage/ starts empty after every restart or deploy.
services:
  - type: web
    name: sunsapp-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /up
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: CORS_ORIGINS
        value: https://gearxnico.github.io
      # Thruster listens on HTTP_PORT and starts Puma on its own TARGET_PORT (3000);
      # PORT tells Render where to send traffic.
      - key: HTTP_PORT
        value: "10000"
      - key: PORT
        value: "10000"
