default: &default
  store_options:
    # Entries expire after 30 days (see ADR 0017); older ones are evicted.
    max_age: <%= 30.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
